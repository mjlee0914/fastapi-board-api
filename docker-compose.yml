services:
  db:
    image: postgres:16
    container_name: board_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-board}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-board1234}
      POSTGRES_DB: ${POSTGRES_DB:-board}
    ports:
      - "5433:5432"   # 로컬 5432는 다른 컨테이너가 사용 중이라 5433으로 노출
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-board}"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
